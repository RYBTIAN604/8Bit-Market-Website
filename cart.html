<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8BIT Market - My Bag</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-red-line"></div>
    <header>
        <div class="nav-top">
            <div class="logo" onclick="location.href='index.html'">8BIT Market</div>
            <button class="icon-btn" onclick="location.href='index.html'">← Back to Shop</button>
        </div>
    </header>

    <main class="cart-page-container">
        <h2 style="color: var(--n-red);">Your Shopping Bag</h2>
        <div id="cartPageList"></div>
        <div style="text-align: right; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;">
            <h3 id="cartPageTotal">Total: ₱0</h3>
            <button class="n-btn-primary" style="width: 200px;" onclick="alert('Proceeding to checkout...')">Checkout</button>
            <button class="n-btn-secondary" style="width: 200px;" onclick="clearBag()">Clear All</button>
        </div>
    </main>

    <script src="script.js"></script>
    <script>window.onload = () => { renderCartPage(); checkAuth(); };</script>
</body>
</html>

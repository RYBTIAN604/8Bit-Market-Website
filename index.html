<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8BIT Market</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="top-red-line"></div>
    <header>
        <div class="nav-top">
            <div class="logo" onclick="location.href='index.html'">8BIT Market</div>
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search products..." onkeyup="filterProducts()">
            </div>
            <div class="header-actions">
                <div class="user-menu">
                    <button class="icon-btn" onclick="toggleAuth()">👤 <span id="userLabel">Sign In</span></button>
                    <div id="authDropdown" class="dropdown-content">
                        <div id="loginForm">
                            <input type="text" id="username" placeholder="Username">
                            <input type="password" id="password" placeholder="Password">
                            <button onclick="login()" class="n-btn-primary">Login</button>
                            <button onclick="signup()" class="n-btn-secondary">Create Account</button>
                        </div>
                        <div id="userInfo" style="display: none;">
                            <p>Hi, <strong id="displayUser"></strong>!</p>
                            <button onclick="logout()" class="n-btn-secondary">Sign Out</button>
                        </div>
                    </div>
                </div>
                <div class="cart-btn" onclick="location.href='cart.html'">🛒 <span id="cartCount">0</span></div>
            </div>
        </div>
        <nav class="categories">
            <button class="cat-btn active" onclick="renderStore('all')">🏠 All Products</button>
            <button class="cat-btn" onclick="renderStore('game')">🎮 Games</button>
            <button class="cat-btn" onclick="renderStore('hardware')">🕹️ Hardware</button>
        </nav>
    </header>

    <main id="store" class="store-grid"></main>

    <script src="script.js"></script>
</body>
</html>

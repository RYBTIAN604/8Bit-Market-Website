<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8BIT Market - My Collection</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="top-red-line"></div>
    <header>
        <div class="nav-top">
            <div class="logo"><span class="red-bg">8BIT</span> MARKET</div>
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search games..." onkeyup="filterProducts()">
            </div>
            <div class="header-actions">
                <div class="user-menu">
                    <button class="icon-btn" onclick="toggleAuth()">👤 <span id="userLabel">Sign In</span></button>
                    <div id="authDropdown" class="dropdown-content">
                        <div id="loginForm">
                            <input type="text" id="username" placeholder="Username">
                            <input type="password" id="password" placeholder="Password">
                            <button onclick="login()" class="n-btn-primary">Login</button>
                            <button onclick="signup()" class="n-btn-secondary">Create Account</button>
                        </div>
                        <div id="userInfo" style="display: none;">
                            <p>Hi, <strong id="displayUser"></strong>!</p>
                            <button onclick="logout()" class="n-btn-secondary">Sign Out</button>
                        </div>
                    </div>
                </div>
                <div class="cart-btn" onclick="toggleCart()">🛒 <span id="cartCount">0</span></div>
            </div>
        </div>
        <nav class="categories">
            <button class="cat-btn active" onclick="renderStore('all')"><span>🏠</span> All Products</button>
            <button class="cat-btn" onclick="renderStore('game')"><span>🎮</span> Games</button>
            <button class="cat-btn" onclick="renderStore('hardware')"><span>🕹️</span> Hardware</button>
        </nav>
    </header>

    <main id="mainContent">
        <div id="store" class="store-grid"></div>
    </main>

    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2 style="color: var(--n-red);">Your Shopping Bag</h2>
            <hr>
            <div id="cartItemsList"></div>
            <div id="cartTotal" style="font-weight: 900; margin: 20px 0;"></div>
            <button class="n-btn-primary" onclick="alert('Checkout success!')">Proceed to Checkout</button>
        </div>
    </div>

    <div id="gameModal" class="modal">
        <div class="modal-content" style="max-width: 500px;">
            <span class="close-btn" onclick="toggleGame()">&times;</span>
            <h2 style="color: var(--n-red);">N-Runner MiniGame</h2>
            <div id="gameCanvasContainer">
                <div id="player"></div>
                <div id="obstacle"></div>
            </div>
            <div id="score">Score: 0</div>
            <button class="n-btn-primary" onclick="startGame()" id="startBtn">Start Game</button>
            <p style="font-size: 12px; margin-top: 10px;">Press <strong>Space</strong> or <strong>Tap</strong> to Jump!</p>
        </div>
    </div>

    <footer style="text-align: center; padding: 40px; border-top: 1px solid #ddd; margin-top: 50px;">
        <p>© 2026 8BIT MARKET Demo</p>
        <button onclick="toggleGame()" style="background:none; border:none; cursor:pointer; font-size: 24px; filter: grayscale(1);" title="Secret Game">❓</button>
    </footer>

    <script src="script.js"></script>
</body>
</html>
